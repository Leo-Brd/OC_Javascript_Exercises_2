<!DOCTYPE html>

<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page accessible</title>
</head>
<body>
    <header>
        <h1>Titre de la Page</h1>
    </header>
    <main>
        <p>Ceci est un paragraphe de texte.</p>

        <form aria-labelledby="form-title">
            <h2 id="form-title">Formulaire de contact</h2>
            <div>
                <label for="name">Nom :</label>
                <input id="name" name="name" type="text" placeholder="Entrez votre nom">
            </div>
            <div>
                <label for="email">Adresse e-mail :</label>
                <input id="email" name="email" type="email" placeholder="Entrez votre adresse e-mail">
            </div>
            <button type="submit">Envoyer</button>
        </form>

        <figure>
            <img src="assets/image.png" height="250" alt="Description de l'image affichée">
            <figcaption>Image illustrative de la page</figcaption>
        </figure>

        <nav>
            <a href="#" title="Lien vers la section d'informations complémentaires">En savoir plus sur l'accessibilité</a>
        </nav>
    </main>
</body>
</html>
